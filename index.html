<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Cleaner — Fast Photo &amp; Video Organizer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 24px;
            background-color: #000000;
            color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            max-width: 560px;
            width: 100%;
            background: #111113;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 32px;
            box-sizing: border-box;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #8e8e93;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            letter-spacing: -0.6px;
        }
        p {
            margin: 0 0 24px;
            line-height: 1.6;
            color: #a1a1a6;
            font-size: 15px;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        a.btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        a.primary {
            background: #ffffff;
            color: #000000;
        }
        a.secondary {
            background: #1c1c1f;
            color: #f5f5f7;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">Android App</div>
        <h1>Gallery Cleaner</h1>
        <p>A gesture-first, 100% on-device photo and video organizer for Android. Review your gallery cleanly with a swipe and reclaim storage safely via Android System Trash.</p>
        <div class="links">
            <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.iusmansial.photocleaner" target="_blank" rel="noopener">Google Play</a>
            <a class="btn secondary" href="/privacy_policy.html">Privacy Policy</a>
        </div>
    </main>
</body>
</html>
